name: Stavario GPS Sync

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:   

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install aiohttp

      - name: Run sync
        env:
          STAVARIO_BASE_URL:    ${{ secrets.STAVARIO_BASE_URL }}
          STAVARIO_USERNAME:    ${{ secrets.STAVARIO_USERNAME }}
          STAVARIO_PASSWORD:    ${{ secrets.STAVARIO_PASSWORD }}
          STAVARIO_LOGIN_PATH:  ${{ secrets.STAVARIO_LOGIN_PATH }}
          STAVARIO_LIST_PATH:   ${{ secrets.STAVARIO_LIST_PATH }}
          STAVARIO_DETAIL_PATH: ${{ secrets.STAVARIO_DETAIL_PATH }}
          STAVARIO_BUILDING_DETAIL_PATH: ${{ secrets.STAVARIO_BUILDING_DETAIL_PATH }}
          ODOO_URL:             ${{ secrets.ODOO_URL }}
          ODOO_DB:              ${{ secrets.ODOO_DB }}
          ODOO_API_KEY:         ${{ secrets.ODOO_API_KEY }}
          ADMIN_EMAIL:          ${{ secrets.ADMIN_EMAIL }}
          PAGE_SIZE:            "100"
          MAX_CONCURRENT:       "10"
        run: python stavario_sync.py
